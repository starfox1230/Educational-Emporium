<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Morning To-Do">
  <meta name="description" content="A touch-friendly morning checklist for Eloise and Matilda.">
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Morning To-Do List</title>
  <style>
    :root {
      color-scheme: light;
      background: #111;
      font-family: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    main {
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100dvh;
    }

    .board {
      position: relative;
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: url("background.jpg") center / 100% 100% no-repeat;
      overflow: hidden;
    }

    .check-target {
      --mark-color: #7138d2;
      position: absolute;
      left: calc(var(--x) - 3%);
      top: calc(var(--y) - 4.1%);
      width: 6%;
      height: 8.2%;
      padding: 0;
      border: 0;
      border-radius: 20%;
      background: transparent;
      cursor: pointer;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    .check-target::after {
      content: "✓";
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      color: var(--mark-color);
      font-family: "Trebuchet MS", "Comic Sans MS", cursive;
      font-size: min(3.5vw, 5.5vh);
      font-weight: 900;
      line-height: 1;
      opacity: 0;
      transform: scale(.65) rotate(-8deg);
      text-shadow: 0 0 .12em rgba(255, 255, 255, .95), .035em .035em 0 rgba(255, 255, 255, .95);
      transition: opacity .16s ease, transform .16s cubic-bezier(.2, 1.4, .4, 1);
    }

    .check-target[aria-pressed="true"]::after {
      opacity: 1;
      transform: scale(1) rotate(-8deg);
    }

    .check-target:focus-visible {
      outline: .22rem solid rgba(255, 255, 255, .95);
      outline-offset: .15rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .check-target::after { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="board" aria-label="Morning to-do checklist">
      <button class="check-target" style="--x: 24%; --y: 36.8%; --mark-color: #7138d2" data-person="Eloise" data-task="Change clothes" aria-label="Eloise: Change clothes" aria-pressed="false"><span class="sr-only">Eloise: Change clothes</span></button>
      <button class="check-target" style="--x: 24%; --y: 45.7%; --mark-color: #7138d2" data-person="Eloise" data-task="PJs in hamper" aria-label="Eloise: PJs in hamper" aria-pressed="false"><span class="sr-only">Eloise: PJs in hamper</span></button>
      <button class="check-target" style="--x: 24%; --y: 54.9%; --mark-color: #7138d2" data-person="Eloise" data-task="Eat breakfast" aria-label="Eloise: Eat breakfast" aria-pressed="false"><span class="sr-only">Eloise: Eat breakfast</span></button>
      <button class="check-target" style="--x: 24%; --y: 63.9%; --mark-color: #7138d2" data-person="Eloise" data-task="Brush hair" aria-label="Eloise: Brush hair" aria-pressed="false"><span class="sr-only">Eloise: Brush hair</span></button>
      <button class="check-target" style="--x: 24%; --y: 72.9%; --mark-color: #7138d2" data-person="Eloise" data-task="Snack and water" aria-label="Eloise: Snack and water" aria-pressed="false"><span class="sr-only">Eloise: Snack and water</span></button>
      <button class="check-target" style="--x: 24%; --y: 81.9%; --mark-color: #7138d2" data-person="Eloise" data-task="Shoes on" aria-label="Eloise: Shoes on" aria-pressed="false"><span class="sr-only">Eloise: Shoes on</span></button>

      <button class="check-target" style="--x: 54.3%; --y: 36.8%; --mark-color: #e43b91" data-person="Matilda" data-task="Change clothes" aria-label="Matilda: Change clothes" aria-pressed="false"><span class="sr-only">Matilda: Change clothes</span></button>
      <button class="check-target" style="--x: 54.3%; --y: 45.7%; --mark-color: #e43b91" data-person="Matilda" data-task="PJs in hamper" aria-label="Matilda: PJs in hamper" aria-pressed="false"><span class="sr-only">Matilda: PJs in hamper</span></button>
      <button class="check-target" style="--x: 54.3%; --y: 54.9%; --mark-color: #e43b91" data-person="Matilda" data-task="Eat breakfast" aria-label="Matilda: Eat breakfast" aria-pressed="false"><span class="sr-only">Matilda: Eat breakfast</span></button>
      <button class="check-target" style="--x: 54.3%; --y: 63.9%; --mark-color: #e43b91" data-person="Matilda" data-task="Brush hair" aria-label="Matilda: Brush hair" aria-pressed="false"><span class="sr-only">Matilda: Brush hair</span></button>
      <button class="check-target" style="--x: 54.3%; --y: 72.9%; --mark-color: #e43b91" data-person="Matilda" data-task="Snack and water" aria-label="Matilda: Snack and water" aria-pressed="false"><span class="sr-only">Matilda: Snack and water</span></button>
      <button class="check-target" style="--x: 54.3%; --y: 81.9%; --mark-color: #e43b91" data-person="Matilda" data-task="Shoes on" aria-label="Matilda: Shoes on" aria-pressed="false"><span class="sr-only">Matilda: Shoes on</span></button>
    </section>
  </main>

  <script>
    (() => {
      const storageKey = "educational-emporium:morning-to-do:v1";
      const targets = [...document.querySelectorAll(".check-target")];

      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
      } catch {
        saved = {};
      }

      const idFor = (target) => `${target.dataset.person}:${target.dataset.task}`;

      const render = (target, checked) => {
        target.setAttribute("aria-pressed", String(checked));
      };

      const saveChecked = (target, checked) => {
        const id = idFor(target);
        saved[id] = checked;
        render(target, checked);
        try {
          localStorage.setItem(storageKey, JSON.stringify(saved));
        } catch {
          // The checklist still works if storage is unavailable.
        }
        return { person: target.dataset.person, task: target.dataset.task, checked };
      };

      targets.forEach((target) => {
        const id = idFor(target);
        render(target, saved[id] === true);
        target.addEventListener("click", () => {
          const checked = target.getAttribute("aria-pressed") !== "true";
          saveChecked(target, checked);
        });
      });

      const modelContext = document.modelContext;
      if (modelContext?.registerTool) {
        try {
          modelContext.registerTool({
            name: "set_morning_checklist_item",
            title: "Set morning checklist item",
            description: "Check or uncheck one visible morning checklist item for Eloise or Matilda.",
            inputSchema: {
              type: "object",
              properties: {
                person: { type: "string", enum: ["Eloise", "Matilda"] },
                task: { type: "string", enum: ["Change clothes", "PJs in hamper", "Eat breakfast", "Brush hair", "Snack and water", "Shoes on"] },
                checked: { type: "boolean" }
              },
              required: ["person", "task", "checked"],
              additionalProperties: false
            },
            annotations: { readOnlyHint: false, untrustedContentHint: false },
            execute(input) {
              if (!input || !["Eloise", "Matilda"].includes(input.person) || typeof input.task !== "string" || typeof input.checked !== "boolean") {
                throw new TypeError("person, task, and checked are required");
              }
              const target = targets.find((candidate) => candidate.dataset.person === input.person && candidate.dataset.task === input.task);
              if (!target) throw new RangeError("Unknown checklist item");
              return saveChecked(target, input.checked);
            }
          });
        } catch {
          // Browsers without WebMCP continue to use the touch interface.
        }
      }

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }
    })();
  </script>
</body>
</html>
