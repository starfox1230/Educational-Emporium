<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="One-at-a-time infinite kindergarten math practice for September 7–11, 2026.">
  <title>Spiral Math Review · September 7–11, 2026</title>
  <style>
    :root {
      --ink: #182532;
      --muted: #6f7d87;
      --blue: #2f7185;
      --blue-dark: #205466;
      --coral: #e8755f;
      --yellow: #f5c85f;
      --mint: #a6d2c1;
      --paper: #fffdf7;
      --line: #dfe5df;
      --good: #4e9975;
      --bad: #c4514f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(232, 117, 95, .2), transparent 25rem),
        radial-gradient(circle at 92% 85%, rgba(166, 210, 193, .32), transparent 28rem),
        #eef3ef;
      font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    .app-shell { width: min(720px, calc(100% - 28px)); margin: 0 auto; padding: 22px 0 38px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--blue-dark); font-weight: 900; letter-spacing: .04em; }
    .brand-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; background: var(--coral); color: white; font-size: 1.35rem; transform: rotate(-6deg); }
    .week { color: var(--muted); font-size: .78rem; font-weight: 800; text-align: right; }
    .week strong { display: block; color: var(--blue-dark); font-size: .92rem; }
    .back { display: inline-block; margin: 0 0 18px; color: var(--muted); font-size: .8rem; font-weight: 800; text-decoration: none; }
    .back:hover { color: var(--coral); }

    .practice-card {
      overflow: hidden;
      border: 1px solid rgba(32, 84, 102, .15);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 22px 55px rgba(31, 56, 64, .14);
    }
    .progress-bar { height: 7px; background: #e3ece7; }
    .progress-bar span { display: block; width: 10%; height: 100%; background: var(--coral); transition: width .25s ease; }
    .card-inner { padding: clamp(24px, 6vw, 48px); }
    .meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 25px; }
    .type-pill { padding: 6px 10px; border-radius: 999px; background: #e8f2ee; color: var(--blue-dark); font-size: .72rem; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; }
    .counter { color: var(--muted); font-size: .78rem; font-weight: 900; }
    .prompt { min-height: 48px; margin: 26px 0 20px; color: var(--blue-dark); font-size: clamp(1.45rem, 4vw, 2rem); font-weight: 900; line-height: 1.08; text-align: center; }
    .problem { display: grid; justify-items: center; min-height: 300px; align-content: center; gap: 20px; }
    .visual { width: 100%; text-align: center; }
    .focus-number { color: var(--ink); font-size: clamp(5rem, 18vw, 9rem); font-weight: 900; line-height: .9; }
    .direction { color: var(--coral); font-size: 3.5rem; font-weight: 900; line-height: .8; }
    .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; width: 100%; }
    .answer-choice { display: grid; place-items: center; min-width: 96px; min-height: 76px; padding: 12px 18px; border: 3px solid var(--ink); border-radius: 18px; background: white; color: var(--ink); font-size: 2rem; font-weight: 900; transition: transform .15s ease, background .15s ease, border-color .15s ease; }
    .answer-choice:hover, .answer-choice:focus-visible { border-color: var(--coral); background: #fff1eb; transform: translateY(-2px); outline: none; }
    .answer-choice.selected { border-color: var(--coral); background: #ffe2d8; }
    .answer-choice.right { border-color: var(--good); background: #e2f2e9; }
    .answer-choice.wrong { border-color: var(--bad); background: #fbe5e2; animation: wobble .25s ease; }
    .objects { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 390px; margin: 0 auto; font-size: clamp(2rem, 8vw, 3.4rem); line-height: 1; }
    .number-word { color: var(--ink); font-family: Georgia, serif; font-size: clamp(3.2rem, 11vw, 5.5rem); font-weight: 900; line-height: 1; }
    .sequence { display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--ink); font-size: clamp(3rem, 12vw, 6rem); font-weight: 900; }
    .sequence .blank { display: grid; place-items: center; width: 1.05em; height: 1.05em; border: 4px dashed var(--coral); border-radius: 16px; color: var(--coral); }
    .dot-field { display: grid; grid-template-columns: repeat(6, 22px); justify-content: center; gap: 10px; max-width: 260px; margin: auto; }
    .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--blue-dark); }
    .tally-display { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 390px; margin: auto; }
    .tally-set { position: relative; display: flex; gap: 5px; height: 66px; padding: 0 5px; border-bottom: 3px solid var(--ink); }
    .tally { width: 5px; height: 58px; border-radius: 2px; background: var(--ink); }
    .tally-set.five::after { content: ""; position: absolute; left: -3px; top: 28px; width: 62px; height: 5px; border-radius: 3px; background: var(--coral); transform: rotate(-54deg); }
    .add-visual { display: flex; align-items: center; justify-content: center; gap: 15px; color: var(--ink); font-size: 2.8rem; font-weight: 900; }
    .add-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; width: 100px; font-size: 2.2rem; line-height: .9; }
    .measure { display: flex; align-items: end; justify-content: center; gap: 24px; min-height: 190px; }
    .measure-object { width: 78px; border: 4px solid var(--ink); border-radius: 10px 10px 3px 3px; background: repeating-linear-gradient(0deg, #e8755f 0 20px, #ffad91 20px 24px); }
    .unit-ruler { position: relative; width: 48px; height: 168px; border: 3px solid var(--blue-dark); border-radius: 4px; background: #f7e6ae; }
    .unit-ruler::after { content: ""; position: absolute; inset: 0 0 0 12px; background: repeating-linear-gradient(0deg, transparent 0 21px, var(--blue-dark) 21px 24px); opacity: .75; }
    .machine { display: grid; place-items: center; width: 170px; min-height: 170px; margin: auto; border: 5px solid var(--ink); border-radius: 48% 48% 20% 20%; background: #f5e7be; box-shadow: inset 0 -30px rgba(232, 117, 95, .12); }
    .machine-window { display: flex; flex-wrap: wrap; align-content: end; justify-content: center; gap: 8px; width: 118px; min-height: 100px; padding: 18px 10px 12px; border: 4px solid var(--ink); border-radius: 18px; background: #fff8e7; }
    .gum-piece { width: 23px; height: 23px; border: 2px solid var(--ink); border-radius: 50%; background: hsl(var(--gum-hue), 72%, 67%); }
    .mini-controls { display: flex; justify-content: center; gap: 14px; }
    .round-control { width: 58px; height: 48px; border: 2px solid var(--blue-dark); border-radius: 14px; background: #e8f2ee; color: var(--blue-dark); font-size: 1.8rem; font-weight: 900; }
    .bar-compare { display: flex; align-items: end; justify-content: center; gap: 42px; height: 190px; }
    .bar-choice { display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--muted); font-size: 1rem; font-weight: 900; }
    .bar-choice span { display: block; width: 66px; border: 4px solid var(--ink); border-radius: 14px 14px 0 0; background: var(--mint); transition: transform .15s ease, border-color .15s ease; }
    .bar-choice:first-child span { height: 118px; background: var(--yellow); }
    .bar-choice:last-child span { height: 174px; background: var(--coral); }
    .bar-choice:hover span, .bar-choice:focus-visible span { border-color: var(--blue-dark); transform: translateY(-4px); outline: none; }
    .pencil-row { display: flex; justify-content: center; gap: 11px; flex-wrap: wrap; }
    .pencil-choice { position: relative; width: 35px; height: 132px; border: 3px solid var(--ink); border-radius: 8px 8px 16px 16px; background: #dceee7; }
    .pencil-choice::before { content: ""; position: absolute; top: -18px; left: 4px; width: 21px; height: 18px; border: 3px solid var(--ink); border-bottom: 0; border-radius: 12px 12px 0 0; background: #e6c097; }
    .pencil-choice:nth-child(2n) { background: #ffd5c9; }
    .pencil-choice.selected { background: var(--coral); transform: translateY(-8px); }
    .trace-guide { color: transparent; -webkit-text-stroke: 2px #94aaa3; font-family: Georgia, serif; font-size: clamp(3.3rem, 13vw, 6rem); font-weight: 900; letter-spacing: .03em; }
    .trace-pad { width: min(410px, 100%); height: 150px; border: 3px dashed var(--coral); border-radius: 18px; background: #fff8ee; touch-action: none; }
    .shape-visual { display: grid; place-items: center; min-height: 180px; }
    .shape-visual svg { width: 180px; height: 180px; }
    .part-whole { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .whole { display: grid; place-items: center; width: 140px; height: 74px; border: 4px dashed var(--coral); border-radius: 18px; color: var(--coral); font-size: 3.5rem; font-weight: 900; }
    .parts { display: flex; gap: 18px; }
    .part { display: grid; place-items: center; width: 94px; height: 64px; border: 3px solid var(--ink); border-radius: 18px; background: #e8f2ee; font-size: 2.4rem; font-weight: 900; }
    .feedback { min-height: 30px; margin-top: 18px; color: var(--good); font-size: 1rem; font-weight: 900; text-align: center; }
    .feedback.bad { color: var(--bad); }
    .submit, .next { width: 100%; margin-top: 5px; padding: 16px 20px; border: 0; border-radius: 15px; color: white; font-size: 1.1rem; font-weight: 900; transition: transform .15s ease, opacity .15s ease; }
    .submit { background: var(--coral); box-shadow: 0 5px 0 #bd5c49; }
    .next { background: var(--blue-dark); box-shadow: 0 5px 0 #153c4a; }
    .submit:not(:disabled):hover, .next:not(:disabled):hover { transform: translateY(-2px); }
    .submit:disabled, .next:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
    .hint { margin-top: 16px; color: var(--muted); font-size: .78rem; font-weight: 800; text-align: center; }
    .home-link { display: block; margin-top: 20px; color: var(--muted); font-size: .8rem; font-weight: 800; text-align: center; text-decoration: none; }
    .home-link:hover { color: var(--coral); }
    @keyframes wobble { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    @media (max-width: 520px) {
      .app-shell { width: min(100% - 18px, 480px); padding-top: 12px; }
      .topbar { margin-bottom: 18px; }
      .brand { font-size: .92rem; }
      .brand-mark { width: 34px; height: 34px; }
      .card-inner { padding: 22px 16px 20px; }
      .problem { min-height: 280px; }
      .answer-choice { min-width: 82px; min-height: 67px; }
      .bar-compare { gap: 27px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <a class="back" href="../../index.html">← Educational Emporium</a>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>Spiral Math</span></div>
      <div class="week"><strong>Sep 7–11, 2026</strong><span>one at a time</span></div>
    </header>

    <section class="practice-card" aria-live="polite">
      <div class="progress-bar"><span id="progress"></span></div>
      <div class="card-inner">
        <div class="meta"><span class="type-pill" id="type-pill">Math</span><span class="counter" id="counter">1</span></div>
        <h1 class="prompt" id="prompt">Let’s do one!</h1>
        <div class="problem" id="problem"></div>
        <div class="feedback" id="feedback"></div>
        <button class="submit" id="submit" type="button" disabled>Submit</button>
        <button class="next" id="next" type="button" disabled>Next ➜</button>
        <div class="hint" aria-hidden="true">Tap an answer</div>
      </div>
    </section>
    <a class="home-link" href="../../index.html">Back to all learning games</a>
  </main>

  <script>
    const WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
    const EMOJIS = ['🍎', '🦋', '🐸', '🌼', '🍓', '🚀', '🐳', '🧸', '🌈', '🍪'];
    const state = { count: 0, streak: 0, current: null, history: new Set(), rng: Math.random() * 2147483646 };
    const $ = (id) => document.getElementById(id);

    function random() { state.rng = state.rng * 16807 % 2147483647; return state.rng / 2147483647; }
    function int(min, max) { return Math.floor(random() * (max - min + 1)) + min; }
    function pick(items) { return items[int(0, items.length - 1)]; }
    function shuffle(items) { return [...items].sort(() => random() - .5); }
    function esc(value) { return String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
    function objects(emoji, amount) { return `<div class="objects" aria-label="${amount} objects">${Array.from({ length: amount }, () => `<span>${emoji}</span>`).join('')}</div>`; }
    function choices(values, answer, display = value => value) { return `<div class="choices" data-answer="${esc(answer)}">${values.map(value => `<button class="answer-choice" type="button" data-value="${esc(value)}">${display(value)}</button>`).join('')}</div>`; }
    function dots(amount) { return `<div class="dot-field" aria-label="${amount} dots">${Array.from({ length: amount }, () => '<span class="dot"></span>').join('')}</div>`; }
    function tallies(amount) {
      const groups = Math.floor(amount / 5), rest = amount % 5;
      return `<div class="tally-display" aria-label="${amount} tally marks">${Array.from({ length: groups }, () => '<span class="tally-set five"><i class="tally"></i><i class="tally"></i><i class="tally"></i><i class="tally"></i></span>').join('')}${rest ? `<span class="tally-set">${Array.from({ length: rest }, () => '<i class="tally"></i>').join('')}</span>` : ''}</div>`;
    }
    function shapeSvg(is3d) { return is3d ? '<svg viewBox="0 0 180 180" aria-label="3D shape"><path d="M36 48 104 26l42 30-69 25Z" fill="#f5c85f" stroke="#182532" stroke-width="6"/><path d="M36 48v76l41 30V81Z" fill="#9ec9b9" stroke="#182532" stroke-width="6" stroke-linejoin="round"/><path d="m77 81 69-25v73l-69 25Z" fill="#e8755f" stroke="#182532" stroke-width="6" stroke-linejoin="round"/></svg>' : '<svg viewBox="0 0 180 180" aria-label="2D shape"><path d="M90 20 155 145H25Z" fill="#e8755f" stroke="#182532" stroke-width="6" stroke-linejoin="round"/></svg>'; }

    const generators = [
      { label: 'Before / after', make() { const n = int(2, 15), before = random() > .5, answer = before ? n - 1 : n + 1; return { prompt: `What comes ${before ? 'before' : 'after'}?`, html: `<div class="visual"><div class="focus-number">${n}</div><div class="direction">${before ? '←' : '→'}</div></div>${choices([answer, before ? n + 1 : n - 1], answer)}`, answer, signature: `before-after-${n}-${before}` }; } },
      { label: 'Count', make() { const n = int(2, 10), emoji = pick(EMOJIS), options = shuffle([n, n + 1, Math.max(1, n - 1)]); return { prompt: 'How many?', html: `<div class="visual">${objects(emoji, n)}</div>${choices(options, n)}`, answer: n, signature: `count-${emoji}-${n}` }; } },
      { label: 'Bigger number', make() { let a = int(1, 10), b = int(1, 10); while (a === b) b = int(1, 10); const answer = Math.max(a, b); return { prompt: 'Which is bigger?', html: choices([a, b], answer, value => `<span class="focus-number" style="font-size:3.6rem">${value}</span>`), answer, signature: `bigger-${a}-${b}` }; } },
      { label: 'Number word', make() { const n = int(1, 9), correct = WORDS[n], wrong = pick(WORDS.filter(word => word !== correct)); return { prompt: 'Which word?', html: `<div class="visual">${objects(pick(EMOJIS), n)}</div>${choices(shuffle([correct, wrong]), correct, value => `<span class="number-word" style="font-size:2rem">${value}</span>`)}`, answer: correct, signature: `word-${n}-${wrong}` }; } },
      { label: 'Missing number', make() { const n = int(2, 14); return { prompt: 'What is missing?', html: `<div class="sequence"><span>${n}</span><span class="blank">?</span><span>${n + 2}</span></div>${choices([n + 1, n + 3], n + 1)}`, answer: n + 1, signature: `sequence-${n}` }; } },
      { label: 'Measure', make() { const n = int(2, 7); return { prompt: 'How many units tall?', html: `<div class="measure"><div class="measure-object" style="height:${n * 24}px" aria-label="a standard bar"></div><div class="unit-ruler" aria-label="a ruler with equal units"></div></div>${choices([n, n + 1, Math.max(1, n - 1)], n)}`, answer: n, signature: `measure-${n}` }; } },
      { label: 'Dots', make() { const n = int(6, 16); return { prompt: 'How many dots?', html: `<div class="visual">${dots(n)}</div>${choices(shuffle([n, n + 1, n - 1]), n)}`, answer: n, signature: `dots-${n}` }; } },
      { label: 'Tally marks', make() { const n = int(5, 14); return { prompt: 'How many?', html: `<div class="visual">${tallies(n)}</div>${choices(shuffle([n, n + 1, n - 1]), n)}`, answer: n, signature: `tally-${n}` }; } },
      { label: 'Add', make() { const a = int(0, 5), b = int(0, 5), answer = a + b; return { prompt: 'Add.', html: `<div class="add-visual"><span class="add-group">${'●'.repeat(a) || '—'}</span><b>+</b><span class="add-group">${'●'.repeat(b) || '—'}</span></div>${choices(shuffle([answer, answer + 1, Math.max(0, answer - 1)]), answer)}`, answer, signature: `add-${a}-${b}` }; } },
      { label: 'Gum machine', make() { const target = int(5, 9); return { prompt: 'Make this many.', html: `<div class="visual"><div class="focus-number" style="font-size:5rem">${target}</div><div class="machine" id="machine" role="button" tabindex="0" aria-label="Add a gum piece"><div class="machine-window" id="gum-display"></div></div></div><div class="mini-controls"><button class="round-control" type="button" data-gum="remove" aria-label="Remove one gum piece">−</button><button class="round-control" type="button" data-gum="add" aria-label="Add one gum piece">＋</button></div>`, answer: target, mode: 'gum', signature: `gum-${target}` }; } },
      { label: 'Number match', make() { const n = int(1, 9); return { prompt: 'Which number?', html: `<div class="number-word">${WORDS[n]}</div>${choices(shuffle([n, n + 1]), n)}`, answer: n, signature: `match-${n}` }; } },
      { label: 'Taller', make() { return { prompt: 'Which is taller?', html: '<div class="bar-compare"><button class="bar-choice" type="button" data-value="A"><span></span><b>A</b></button><button class="bar-choice" type="button" data-value="B"><span></span><b>B</b></button></div>', answer: 'B', mode: 'custom-choice', signature: `taller-${int(0, 999999)}` }; } },
      { label: 'Pencils', make() { const target = int(2, 5); return { prompt: `Tap ${target}.`, html: `<div class="pencil-row">${Array.from({ length: 6 }, (_, i) => `<button class="pencil-choice" type="button" data-pencil="${i}" aria-label="Pencil ${i + 1}"></button>`).join('')}</div>`, answer: target, mode: 'pencils', signature: `pencils-${target}` }; } },
      { label: 'Trace', make() { const n = int(1, 9); return { prompt: 'Trace.', html: `<div class="trace-guide">${WORDS[n]}</div><canvas class="trace-pad" id="trace-pad" width="600" height="220" aria-label="Trace here"></canvas>`, answer: WORDS[n], mode: 'trace', signature: `trace-${n}` }; } },
      { label: 'Middle number', make() { const n = int(0, 8); return { prompt: 'What is in the middle?', html: `<div class="sequence"><span>${n}</span><span class="blank">?</span><span>${n + 2}</span></div>${choices([n + 1, n + 2], n + 1)}`, answer: n + 1, signature: `middle-${n}` }; } },
      { label: '2D or 3D', make() { const is3d = random() > .5, answer = is3d ? '3D' : '2D'; return { prompt: '2D or 3D?', html: `<div class="shape-visual">${shapeSvg(is3d)}</div>${choices(['2D', '3D'], answer)}`, answer, signature: `shape-${is3d}` }; } },
      { label: 'Part + part', make() { const a = int(1, 5), b = int(1, 5), answer = a + b; return { prompt: 'What is the whole?', html: `<div class="part-whole"><div class="whole">?</div><div class="parts"><div class="part">${a}</div><div class="part">${b}</div></div></div>${choices(shuffle([answer, answer + 1, Math.max(1, answer - 1)]), answer)}`, answer, signature: `whole-${a}-${b}` }; } },
      { label: 'Greater number', make() { let a = int(1, 9), b = int(1, 9); while (a === b) b = int(1, 9); const answer = Math.max(a, b); return { prompt: 'Which is greater?', html: choices([a, b], answer, value => `<span class="focus-number" style="font-size:3.6rem">${value}</span>`), answer, signature: `greater-${a}-${b}` }; } }
    ];

    function uniqueProblem() {
      let result, generator;
      do { generator = pick(generators); result = generator.make(); } while (state.history.has(result.signature));
      state.history.add(result.signature);
      if (state.history.size > 500) state.history.delete(state.history.values().next().value);
      result.label = generator.label;
      return result;
    }

    function setFeedback(message, bad = false) { $('feedback').textContent = message; $('feedback').classList.toggle('bad', bad); }
    function finish(correct) {
      if (correct) { state.streak += 1; setFeedback('✓'); $('submit').disabled = true; $('next').disabled = false; $('next').focus(); }
      $('counter').textContent = `⭐ ${state.streak}`;
    }
    function readyToSubmit() { $('submit').disabled = false; setFeedback(''); }
    function markChoices(container, value) {
      container.querySelectorAll('[data-value]').forEach(button => {
        button.classList.remove('selected', 'right', 'wrong');
        if (String(button.dataset.value) === String(value)) button.classList.add('selected');
      });
      state.current.selected = value;
      readyToSubmit();
    }
    function setupTrace() {
      const canvas = $('trace-pad'), ctx = canvas.getContext('2d');
      ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.strokeStyle = '#e8755f';
      let drawing = false, drawn = false;
      const point = event => { const rect = canvas.getBoundingClientRect(); return { x: (event.clientX - rect.left) * canvas.width / rect.width, y: (event.clientY - rect.top) * canvas.height / rect.height }; };
      canvas.addEventListener('pointerdown', event => { drawing = true; drawn = true; state.current.selected = true; readyToSubmit(); canvas.setPointerCapture(event.pointerId); const p = point(event); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
      canvas.addEventListener('pointermove', event => { if (!drawing) return; const p = point(event); ctx.lineTo(p.x, p.y); ctx.stroke(); });
      canvas.addEventListener('pointerup', () => { drawing = false; });
    }
    function setupSpecial() {
      const type = state.current.mode;
      if (type === 'gum') {
        let count = 0;
        const update = () => {
          count = Math.max(0, Math.min(12, count));
          $('gum-display').innerHTML = Array.from({ length: count }, (_, index) => `<span class="gum-piece" style="--gum-hue:${(index * 47) % 360}" aria-hidden="true"></span>`).join('');
          state.current.selected = count;
          if (count > 0) readyToSubmit();
        };
        $('machine').addEventListener('click', () => { count += 1; update(); });
        $('machine').addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); count += 1; update(); } });
        document.querySelectorAll('[data-gum]').forEach(button => button.addEventListener('click', () => { count += button.dataset.gum === 'add' ? 1 : -1; update(); }));
      } else if (type === 'pencils') {
        document.querySelectorAll('.pencil-choice').forEach(button => button.addEventListener('click', () => { button.classList.toggle('selected'); state.current.selected = document.querySelectorAll('.pencil-choice.selected').length; if (state.current.selected > 0) readyToSubmit(); }));
      } else if (type === 'trace') setupTrace();
    }
    function evaluate() {
      const actual = state.current.selected;
      const correct = state.current.mode === 'trace' ? Boolean(actual) : String(actual) === String(state.current.answer);
      if (correct) { finish(true); return; }
      setFeedback('Try again', true);
      const selected = document.querySelector('[data-value].selected');
      if (selected) { selected.classList.remove('selected'); selected.classList.add('wrong'); }
    }
    function render() {
      state.count += 1; state.current = uniqueProblem();
      $('type-pill').textContent = state.current.label; $('prompt').textContent = state.current.prompt; $('problem').innerHTML = state.current.html; $('feedback').textContent = ''; $('feedback').classList.remove('bad'); $('submit').disabled = true; $('next').disabled = true; $('counter').textContent = `⭐ ${state.streak}`; $('progress').style.width = `${Math.min(100, 10 + (state.count % 10) * 9)}%`;
      document.querySelectorAll('.choices').forEach(container => container.querySelectorAll('.answer-choice').forEach(button => button.addEventListener('click', () => markChoices(container, button.dataset.value))));
      if (state.current.mode === 'custom-choice') document.querySelectorAll('.bar-choice').forEach(button => button.addEventListener('click', () => markChoices(document.querySelector('.bar-compare'), button.dataset.value)));
      setupSpecial();
    }
    $('submit').addEventListener('click', evaluate);
    $('next').addEventListener('click', render);
    document.addEventListener('keydown', event => { if (event.key === 'Enter' && !$('next').disabled) render(); });
    render();
  </script>
</body>
</html>
