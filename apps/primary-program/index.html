<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="A simple local playlist for Primary program song practice.">
  <title>Primary Songs</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player" aria-label="Primary song practice player">
    <header class="topbar">
      <a class="back" href="../../index.html" aria-label="Educational Emporium">←</a>
      <span class="eyebrow">EDUCATIONAL EMPORIUM</span>
      <span class="spacer"></span>
    </header>

    <section class="intro">
      <div class="cover" aria-hidden="true">
        <svg viewBox="0 0 112 112" role="presentation">
          <circle cx="56" cy="56" r="51" fill="#f4e4ba"/>
          <path d="M18 81c16-10 31-10 47 0 9-6 19-8 30-5v15c-11-3-21-1-30 5-16-10-31-10-47 0z" fill="#fffdf6"/>
          <path d="M18 81c16-10 31-10 47 0v15c-16-10-31-10-47 0zm47 0c9-6 19-8 30-5v15c-11-3-21-1-30 5z" fill="#d9e5cf"/>
          <path d="M56 77c-5-10-22-17-18-31 3-11 16-8 18 1 2-9 15-12 18-1 4 14-13 21-18 31z" fill="#d98c7b"/>
          <path d="M24 32c4-8 10-12 18-13m46 13c-4-8-10-12-18-13" fill="none" stroke="#fffdf6" stroke-width="4" stroke-linecap="round"/>
          <circle cx="25" cy="55" r="3" fill="#e4b85d"/><circle cx="87" cy="55" r="3" fill="#e4b85d"/>
        </svg>
      </div>
      <h1>Primary songs</h1>
      <p id="status" aria-live="polite">Choose songs on this device</p>
      <label class="choose" for="files">Choose songs <span aria-hidden="true">＋</span></label>
      <input id="files" type="file" accept="audio/*,.m4a,.mp3,.mp4,.wav" multiple>
    </section>

    <section class="playlist" aria-label="Playlist">
      <div class="list-heading"><span>PLAY NEXT</span><button id="selectAll" type="button">Deselect all</button></div>
      <ol id="songs"></ol>
    </section>

    <section class="transport" aria-label="Playback controls">
      <div class="now-playing"><span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="currentTitle">Ready when you are</span></div>
      <input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      <div class="buttons">
        <button id="previous" class="side-button" type="button" aria-label="Previous song">⏮</button>
        <button id="play" class="play-button" type="button" aria-label="Choose songs to play"><span id="playGlyph">▶</span></button>
        <button id="next" class="side-button" type="button" aria-label="Next song">⏭</button>
      </div>
      <div class="loop-note"><span class="loop-icon">↻</span> <span id="loopCount">8 songs · loops</span></div>
    </section>
    <audio id="audio" preload="metadata" playsinline></audio>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
